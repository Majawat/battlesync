version: 2
updates:
  # Backend Node/TypeScript dependencies (root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Majawat"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Batch all non-breaking backend updates into one PR;
      # major bumps still arrive as separate, individually reviewable PRs.
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Majawat"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # react and react-dom must share a major version — keep them together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Dockerfile base images (root only; there is no frontend/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Majawat"
    commit-message:
      prefix: "docker"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Majawat"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
